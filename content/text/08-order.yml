# Order rules (Katya can change these):
min_days_ahead: 3
small_min_pieces: 6
phone_required: true
message_required: true
eyebrow: How to order
eyebrow_is: Svona pantar þú
heading: Let’s make your cake.
heading_is: Búum til kökuna þína.
intro: There is no online checkout — simply send me a message. I prefer to discuss each order personally, so your cake is exactly right and I can confirm that I am available on your date.
intro_is: Það er engin netverslun — sendu mér einfaldlega skilaboð. Ég vil ræða hverja pöntun persónulega, svo kakan verði nákvæmlega eins og þú vilt og ég geti staðfest að ég sé laus á þeim degi sem þú óskar.
steps:
- text: '**Send a request** — the cake, the date and the quantity.'
  text_is: '**Sendu fyrirspurn** — kakan, dagsetningin og fjöldinn.'
- text: '**I confirm** availability, the details and the price.'
  text_is: '**Ég staðfesti** að ég sé laus, smáatriðin og verðið.'
- text: '**Collection or delivery** — on the agreed day.'
  text_is: '**Sótt eða sent** — á umsömdum degi.'
