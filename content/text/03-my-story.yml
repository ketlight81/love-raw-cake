values:
- title: Whole & real
  title_is: Hreint & alvöru
  text: Plant milks I make myself from soaked nuts, cacao butter, fruit and berries — no refined sugar, no flour, no dairy, no eggs.
  text_is: Jurtamjólk sem ég bý til sjálf úr útbleyttum hnetum, kakósmjör, ávextir og ber — enginn hvítur sykur, ekkert hveiti, engar mjólkurvörur, engin egg.
  show: true
- title: Nothing wasted
  title_is: Engin sóun
  text: Even the pulp left from making nut milk goes back into the cake. Made to order, frozen beautifully, never thrown away.
  text_is: Jafnvel hratið sem verður eftir af hnetumjólkinni fer aftur í kökuna. Gert eftir pöntun, fryst fallega, aldrei hent.
  show: true
- title: Made with love
  title_is: Gert af ást
  text: I believe only something made with love can truly do you good. That belief is in the name.
  text_is: Ég trúi því að aðeins það sem er gert af ást geti raunverulega gert þér gott. Sú trú býr í nafninu.
  show: true
