heading: Made by someone who really cares.
heading_is: Gerðar af manneskju sem er virkilega annt um þig.
intro: My name is Katya. I love people and their stories. I’m a trained raw-cake crafter and I’m training as a coach because I care about both how we treat our bodies and how we treat our minds — they’re connected.
intro_is: Ég heiti Katya. Ég elska fólk og sögurnar þess. Ég er menntuð í hrákökugerð og er í markþjálfanámi, því mér er annt bæði um hvernig við förum með líkamann og hvernig við förum með hugann — þetta tvennt tengist.
story_start: My first impulse was to learn to make raw cakes for my own and my family’s health. Then I thought of everyone who can’t eat the usual cakes — allergies, sugar, dairy — and wanted them to have a beautiful, healthier choice too.
story_start_is: Fyrsti hvati minn var að læra að gera hrákökur fyrir heilsu mína og fjölskyldunnar. Svo hugsaði ég til allra sem geta ekki borðað venjulegar kökur — vegna ofnæmis, sykurs eða mjólkurvara — og vildi að þau fengju líka fallegan og hollari valkost.
story_more: 'That’s when I realised I wanted to change how cake is seen. For most of us, “cake” means sugar, guilt, something to regret later. I truly believe it can mean the opposite: real nourishment that happens to taste incredible.'
story_more_is: 'Þá áttaði ég mig á því að mig langaði að breyta því hvernig fólk lítur á kökur. Fyrir flest okkar þýðir „kaka“ sykur, samviskubit, eitthvað sem maður sér eftir. Ég trúi því í alvöru að hún geti þýtt hið gagnstæða: raunverulega næringu sem bragðast líka ótrúlega vel.'
story_end: 'Raw Love Cakes are built from good ingredients — and good ingredients are the only way to a good result. That’s what goes into every box: healthy ingredients, care for the person who’ll open it, and no waste behind it — in raw-cake making it’s easy to use every last ingredient, so it’s care twice over: for you and for the planet.'
story_end_is: 'Kökurnar mínar eru gerðar úr góðum hráefnum — og góð hráefni eru eina leiðin að góðri útkomu. Það er það sem fer í hvert box: holl hráefni, umhyggja fyrir manneskjunni sem opnar það og engin sóun á bak við — í hrákökugerð er auðvelt að nýta hvert einasta hráefni, svo umhyggjan er tvöföld: fyrir þig og fyrir jörðina.'
