order_note: 🕒 Please order **at least 3 days ahead** — every cake is made to order (some, like fermented-cashew recipes, need 24h to ferment). Whole cakes, or small cakes by the plate.
order_note_is: 🕒 Pantaðu **með minnst 3 daga fyrirvara** — hver kaka er gerð eftir pöntun (sumar uppskriftir, t.d. með gerjuðum kasjúhnetum, þurfa 24 klst. til að gerjast). Heilar kökur, eða litlar kökur á diski.
