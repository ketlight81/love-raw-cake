intro: I love passing on what I know. Raw cakes are simpler than they look — and there’s real joy in making something this good with your own hands. Courses are on the way. Want first access?
intro_is: Mér þykir gaman að miðla því sem ég kann. Hrákökur eru einfaldari en þær líta út fyrir að vera — og það er sönn gleði í því að búa til eitthvað svona gott með eigin höndum. Námskeið eru á leiðinni. Viltu fá að vita fyrst?
