eyebrow: For events
eyebrow_is: Fyrir viðburði
heading: Beautiful, healthy treats for any gathering.
heading_is: Fallegar, hollar kræsingar fyrir hvert tilefni.
intro: Got vegan or health-conscious guests? Make sure they’re thought of. I cater corporate events, receptions and celebrations with finger-food minis and platters — the same real ingredients, scaled up.
intro_is: Ertu með vegan gesti eða gesti sem hugsa um heilsuna? Gættu þess að þeirra sé líka minnst. Ég sé um veitingar fyrir fyrirtækjaviðburði, móttökur og veislur með litlum kökum og bökkum — sömu alvöru hráefnin, bara í stærri skömmtum.
points:
- text: Mini-cakes & finger-food in reception-friendly sizes
  text_is: Litlar kökur & smáréttir í hentugum stærðum fyrir móttökur
  show: true
- text: Platters from {small_min} pieces; larger orders from ~50 pieces
  text_is: Bakkar frá {small_min} stykkjum; stærri pantanir frá u.þ.b. 50 stykkjum
  show: true
- text: Trusted by **Nordic House**, **Vigdís House**, the **University of Iceland** café and **Iðnó**
  text_is: 'Meðal viðskiptavina: **Norræna húsið**, **Veröld – hús Vigdísar**, **kaffihús Háskóla Íslands** og **Iðnó**'
  show: true
button: Plan an event order
button_is: Skipuleggja pöntun fyrir viðburð
