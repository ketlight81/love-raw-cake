# Pages CMS — what Katya sees in the editor (app.pagescms.org).
# Labels in English, matching the site. Field names must stay as they are — build.py reads them.
# After every "Save" GitHub runs build.py (.github/workflows/build.yml) and the site updates in ~1–2 min.

settings:
  commit:
    identity: user          # the commit history shows who edited (Katya / Marina), not "Pages CMS"

media:
  input: images/uploads
  output: /images/uploads
  rename: true              # upload names made safe (Latin, lowercase, no spaces) — same as Natasha's site
  extensions: [jpg, jpeg, png, webp]

content:
  - name: cakes
    label: Cakes
    type: collection
    path: content/cakes
    format: yaml-frontmatter
    filename: "{primary}.md"
    view:
      primary: title
      fields: [title, section, show]
      sort: position
    fields:
      - name: title
        label: Name
        type: string
        required: true
        description: "As shown on the site, e.g. Carrot Cake"
      - name: title_is
        label: Name (Icelandic)
        type: string
        description: "Optional. Empty = the English name is used on the Icelandic page too"
      - name: section
        label: Section
        type: select
        required: true
        default: cakes
        options:
          values:
            - name: cakes
              label: Cakes
            - name: small
              label: Small Cakes
            - name: friday
              label: Friday Box
      - name: position
        label: Position
        type: number
        description: "1 = first. To place a cake between 2 and 3, use 2.5"
      - name: show
        label: Show on site
        type: boolean
        default: true
        description: "Off = hidden from the site and the order form, but not deleted"
      - name: card_text
        label: Card text
        type: text
        required: true
        description: "One sentence, shown on the card (and to Google)"
      - name: card_text_is
        label: Card text (Icelandic)
        type: text
        description: "Empty = English card text is used on the Icelandic page"
      - name: description
        label: Description
        type: text
        description: "2–3 sentences in the cake pop-up. Empty = card text is used"
      - name: description_is
        label: Description (Icelandic)
        type: text
        description: "Empty = Icelandic card text is used"
      - name: ingredients
        label: Ingredients
        type: text
        description: "Comma-separated, ending with a full stop"
      - name: ingredients_is
        label: Ingredients (Icelandic)
        type: text
        description: "Check carefully — allergy information. Empty = English list is used"
      - name: vegan
        label: Vegan badge
        type: boolean
        default: true
      - name: gluten_free
        label: Gluten-free badge
        type: boolean
        default: true
      - name: allergen
        label: Allergen badge
        type: string
        description: "e.g. Contains nuts · Peanut · Pistachio · nuts. Empty = no badge"
      - name: allergen_is
        label: Allergen badge (Icelandic)
        type: string
        description: "e.g. Inniheldur hnetur · Jarðhnetur"
      - name: note
        label: Extra badge
        type: string
        description: "Optional, e.g. New · Seasonal"
      - name: note_is
        label: Extra badge (Icelandic)
        type: string
      - name: price_per_100g
        label: Price per 100 g (ISK)
        type: number
        description: "Number only, e.g. 1100. Used for Google; customers see prices in Prices & Delivery"
      - name: protein
        label: Protein (g per 100 g)
        type: number
        description: "Nutrition — only your own measured figures. Fill all four or none"
      - name: fat
        label: Fat (g per 100 g)
        type: number
      - name: carbs
        label: Carbs (g per 100 g)
        type: number
      - name: kcal
        label: Kcal per 100 g
        type: number
      - name: card_image
        label: Card photo
        type: image
        description: "Landscape 4:3, about 1600 × 1200 px, JPG. Cropped to 4:3 — keep the cake in the middle. Upload the file (no Google Drive / Instagram links). Empty = first gallery photo is used"
      - name: card_alt
        label: Card photo description
        type: string
        description: "What the photo shows, e.g. Raw carrot cake with pecans (for Google and screen readers)"
      - name: card_alt_is
        label: Card photo description (Icelandic)
        type: string
      - name: photos
        label: Gallery
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{fields.caption}"
        fields:
          - name: image
            label: Photo
            type: image
            required: true
            description: "Square 1:1, about 1600 × 1600 px, JPG. Shown as a square — the edges of a landscape photo are cut off"
          - name: caption
            label: Caption
            type: string
            description: "Short: The whole cake · A slice · From the side"
          - name: caption_is
            label: Caption (Icelandic)
            type: string
            description: "e.g. Öll kakan · Sneið · Frá hlið"

  - name: blog
    label: Blog
    type: collection
    path: content/blog
    format: yaml-frontmatter
    filename: "{year}-{month}-{primary}.md"
    view:
      primary: title
      fields: [title, date, show]
      sort: date
      order: desc
    fields:
      - name: title
        label: Title
        type: string
        required: true
      - name: date
        label: Date
        type: date
        required: true
      - name: show
        label: Show on site
        type: boolean
        default: true
        description: "Off while the post is a draft"
      - name: excerpt
        label: Excerpt
        type: text
        required: true
        description: "1–2 sentences shown in the blog list"
      - name: description
        label: Google description
        type: text
        description: "One sentence for search results. Empty = excerpt is used"
      - name: image
        label: Main photo
        type: image
        description: "Landscape 4:3, about 1600 × 1200 px, JPG. Whole photo at the top of the post; cropped to 4:3 in the blog list"
      - name: image_alt
        label: Photo description
        type: string
      - name: body
        label: Text
        type: rich-text
      # ---- Icelandic version (optional). The post appears in Icelandic on the IS blog once
      #      BOTH "Title (Icelandic)" and "Text (Icelandic)" are filled; until then it is listed there in English.
      - name: title_is
        label: Title (Icelandic)
        type: string
        description: "Fill this and Text (Icelandic) to publish the Icelandic version"
      - name: excerpt_is
        label: Excerpt (Icelandic)
        type: text
        description: "Empty = English excerpt"
      - name: description_is
        label: Google description (Icelandic)
        type: text
        description: "Empty = Icelandic excerpt"
      - name: image_alt_is
        label: Photo description (Icelandic)
        type: string
      - name: body_is
        label: Text (Icelandic)
        type: rich-text

